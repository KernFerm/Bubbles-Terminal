<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Bubbles CMD logo</title>
  <desc id="desc">A B monogram inside a glowing terminal bubble.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1720"/>
      <stop offset="1" stop-color="#1b3342"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fc9b5"/>
      <stop offset="1" stop-color="#58b9ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#background)"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ring)" stroke-width="34"/>
  <circle cx="172" cy="150" r="42" fill="#ffffff" opacity=".16"/>
  <text x="256" y="326" text-anchor="middle" fill="#ecf3f9" font-family="Segoe UI, Arial, sans-serif" font-size="210" font-weight="800">B</text>
</svg>
