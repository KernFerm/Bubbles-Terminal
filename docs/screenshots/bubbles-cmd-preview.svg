<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Bubbles CMD preview</title>
  <desc id="desc">A stylized preview of the Bubbles CMD terminal application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1720"/>
      <stop offset="1" stop-color="#111d2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fc9b5"/>
      <stop offset="1" stop-color="#58b9ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" rx="34" fill="url(#bg)"/>
  <rect x="34" y="34" width="1212" height="150" rx="26" fill="#16212c"/>
  <text x="68" y="96" fill="#ecf3f9" font-family="Segoe UI, sans-serif" font-size="42" font-weight="700">Bubbles CMD</text>
  <text x="70" y="136" fill="#9aaec2" font-family="Segoe UI, sans-serif" font-size="20">Real Windows shells in a modern terminal workspace</text>
  <rect x="690" y="62" width="330" height="42" rx="8" fill="#ffffff"/>
  <text x="710" y="90" fill="#111827" font-family="Segoe UI, sans-serif" font-size="18">Windows PowerShell</text>
  <g fill="#1e2d3c" stroke="#5fc9b5" stroke-width="2">
    <rect x="1035" y="62" width="92" height="42" rx="8"/>
    <rect x="1138" y="62" width="74" height="42" rx="8"/>
    <rect x="690" y="116" width="90" height="42" rx="8"/>
    <rect x="792" y="116" width="96" height="42" rx="8"/>
    <rect x="900" y="116" width="102" height="42" rx="8"/>
  </g>
  <text x="1056" y="89" fill="#ecf3f9" font-family="Segoe UI, sans-serif" font-size="16">New Tab</text>
  <text x="1157" y="89" fill="#ecf3f9" font-family="Segoe UI, sans-serif" font-size="16">Split</text>
  <text x="714" y="143" fill="#ecf3f9" font-family="Segoe UI, sans-serif" font-size="16">Palette</text>
  <text x="814" y="143" fill="#ecf3f9" font-family="Segoe UI, sans-serif" font-size="16">Settings</text>
  <text x="924" y="143" fill="#ecf3f9" font-family="Segoe UI, sans-serif" font-size="16">Commands</text>
  <rect x="34" y="214" width="1212" height="420" rx="24" fill="#050505" stroke="url(#accent)" stroke-width="3"/>
  <text x="68" y="270" fill="#f2f2f2" font-family="Cascadia Mono, Consolas, monospace" font-size="24">Windows PowerShell</text>
  <text x="68" y="310" fill="#f2f2f2" font-family="Cascadia Mono, Consolas, monospace" font-size="24">Copyright (C) Microsoft Corporation. All rights reserved.</text>
  <text x="68" y="382" fill="#f2f2f2" font-family="Cascadia Mono, Consolas, monospace" font-size="24">PS C:\Users\bubbles&gt; git status</text>
  <text x="68" y="426" fill="#5fc9b5" font-family="Cascadia Mono, Consolas, monospace" font-size="24">On branch main</text>
  <text x="68" y="470" fill="#58b9ff" font-family="Cascadia Mono, Consolas, monospace" font-size="24">nothing to commit, working tree clean</text>
  <rect x="34" y="660" width="1212" height="36" rx="18" fill="#16212c"/>
  <text x="58" y="684" fill="#9aaec2" font-family="Segoe UI, sans-serif" font-size="16">Bubbles CMD 0.0.4 | Ctrl+Shift+1 PowerShell | Ctrl+Shift+2 Command Prompt | Ctrl+Shift+P Palette</text>
</svg>
