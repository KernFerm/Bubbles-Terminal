name: Build And Release Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, Test, Package, Validate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\BubblesCmd.sln

      - name: Build
        run: dotnet build .\BubblesCmd.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\BubblesCmd.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Package
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Build MSI
        shell: pwsh
        run: .\scripts\build-msi.ps1

      - name: Validate Artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path .\artifacts\packages\bubbles-cmd-0.0.4-win-x64.zip)) { throw 'ZIP package was not created.' }
          if (-not (Test-Path .\artifacts\installer\bubbles-cmd-0.0.4-win-x64.msi)) { throw 'MSI package was not created.' }

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: bubbles-cmd-test-results
          path: '**/test-results.trx'
          if-no-files-found: error

      - name: Upload ZIP Package
        uses: actions/upload-artifact@v4
        with:
          name: bubbles-cmd-0.0.4-win-x64
          path: artifacts/packages/bubbles-cmd-0.0.4-win-x64.zip
          if-no-files-found: error

      - name: Upload MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: bubbles-cmd-0.0.4-win-x64-msi
          path: artifacts/installer/bubbles-cmd-0.0.4-win-x64.msi
          if-no-files-found: error
